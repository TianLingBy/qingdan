name: frozen-guard

# 后端 2026-11-21 **完全冻结**（docs/BACKEND-FROZEN.md 第七节，tag `backend-v1.0.2`）。
# 只要 PR 碰了冻结清单就红——没有标题豁免、没有 `[unfreeze]` 口子。
# 真要动，得先改这个 workflow 本身，那是一次公开、可审计的动作。

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: frozen-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend-frozen:
    name: backend-frozen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 冻结清单不许再动
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          # 与 docs/BACKEND-FROZEN.md 第一节的表格一一对应。
          FROZEN=(
            apps/api
            packages/contracts
            apps/cli
            apps/mcp
            docs/api/openapi.yaml
          )
          git fetch --no-tags --quiet origin "$BASE_REF"
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
          hit=""
          for path in "${FROZEN[@]}"; do
            while IFS= read -r file; do
              case "$file" in
                "$path"|"$path"/*) hit="$hit"$'\n'"$file" ;;
              esac
            done <<< "$changed"
          done
          if [ -z "$hit" ]; then
            echo "没动冻结清单，放行。"
            exit 0
          fi
          echo "::error::后端已完全冻结（docs/BACKEND-FROZEN.md）：下面这些文件不许再改。$hit"
          echo ""
          echo "允许的前端改造范围：apps/web/**、docs/**（除 docs/api/openapi.yaml）。"
          echo "若确有阻塞性缺陷，先在 issue 里带复现步骤与日志说明，由负责人决定是否改本守卫——PR 标题加什么前缀都没用。"
          exit 1
