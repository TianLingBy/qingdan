<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>轻单 · 登录</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="login.css">
  <script src="login.js" defer></script>
</head>

<body class="login">
  <canvas id="fx"></canvas>
  <div class="aura" id="aura"></div>

  <div class="stage">
    <div class="brand">
      <div class="brand-top">
        <div class="mark">轻</div>
        <div class="brand-name">轻单<span>Qingdan</span></div>
      </div>
      <div class="statement">
        <div class="eyebrow">Internal Ledger</div>
        <h1>用轻单<br>算清你的清单</h1>
        <p class="lede">
          全链条口径统一打通 权限分明 数据透明
        </p>
      </div>
    </div>

    <div class="panel">
      <form class="card" id="form" novalidate>
        <div class="card-head">
          <div class="card-eyebrow">// Sign in</div>
          <h2>登录</h2>
          <p class="card-sub">欢迎回来，请登录您的账号</p>
        </div>
        <div class="field" id="f-phone">
          <label for="phone">手机号</label>
          <input id="phone" name="phone" inputmode="numeric" autocomplete="username" placeholder="11 位手机号">
          <span class="err">请输入 11 位手机号</span>
        </div>
        <div class="field" id="f-code">
          <label for="code">验证码</label>
          <div class="code-row"><input id="code" name="code" inputmode="numeric" autocomplete="one-time-code"
              placeholder="6 位验证码"><button type="button" class="code-btn" id="send">获取验证码</button></div>
          <span class="err">请输入验证码</span>
        </div>
        <div class="row-between">
          <label class="check">
            <input type="checkbox" id="remember" checked>
            在这台设备上保持登录
          </label>
          <a class="link" href="#" id="help">忘记密码</a>
        </div>
        <button class="btn" type="submit" id="submit">
          <span class="spin"></span>
          <span class="label">登 录</span>
        </button>
      </form>
    </div>
  </div>

  <div class="corner">Qingdan v0.13</div>
  <div class="login-mode" id="mode-tgl" role="group" aria-label="外观模式">
    <button type="button" data-mode-set="dark" aria-label="暗色模式" title="暗"><svg viewBox="0 0 7 7"
        shape-rendering="crispEdges" aria-hidden="true">
        <path d="M2 0h3v1h-3z M1 1h2v1h-2z M0 2h3v1h-3z M0 3h3v1h-3z M0 4h3v1h-3z M1 5h2v1h-2z M2 6h3v1h-3z" />
      </svg></button>
    <button type="button" data-mode-set="light" aria-label="亮色模式" title="亮"><svg viewBox="0 0 7 7"
        shape-rendering="crispEdges" aria-hidden="true">
        <path
          d="M3 0h1v1h-1z M1 1h1v1h-1z M3 1h1v1h-1z M5 1h1v1h-1z M2 2h3v1h-3z M0 3h1v1h-1z M2 3h3v1h-3z M6 3h1v1h-1z M2 4h3v1h-3z M1 5h1v1h-1z M3 5h1v1h-1z M5 5h1v1h-1z M3 6h1v1h-1z" />
      </svg></button>
  </div>
  <div class="copy-hint" id="toast">已进入（演示环境）</div>
</body>

</html>
