<!DOCTYPE html>
<html lang="zh-CN" data-fs="m" data-trans="fade"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>轻单 · 登录</title>
<script>try{var m=location.search.match(/[?&]theme=(moss|mist|bronze|paper)/);var t=m?m[1]:localStorage.getItem("qd-theme");if(t&&t!=="moss")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="components.css"><link rel="stylesheet" href="ui.css">
<style>*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);color:#fff;min-height:100vh;overflow:hidden;
  background:radial-gradient(1200px 700px at 18% 8%,rgba(60,120,100,.30),transparent 62%),
  radial-gradient(900px 600px at 82% 92%,rgba(40,80,110,.30),transparent 62%),#070b09}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background-image:radial-gradient(1.6px 1.6px at 20% 30%,rgba(255,255,255,.9),transparent),
  radial-gradient(1.2px 1.2px at 72% 18%,rgba(255,255,255,.75),transparent),
  radial-gradient(1.4px 1.4px at 44% 68%,rgba(255,255,255,.6),transparent),
  radial-gradient(1.8px 1.8px at 86% 54%,rgba(255,255,255,.7),transparent),
  radial-gradient(1.1px 1.1px at 12% 78%,rgba(255,255,255,.55),transparent),
  radial-gradient(1.3px 1.3px at 62% 84%,rgba(255,255,255,.5),transparent);
  animation:tw 6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.6}to{opacity:1}}
.halo{position:fixed;left:50%;top:50%;width:760px;height:760px;margin:-380px 0 0 -380px;border-radius:50%;
  background:radial-gradient(circle,rgba(var(--accent-rgb),.18),transparent 62%);filter:blur(4px)}
.stage{position:relative;z-index:2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card-login{width:392px;padding:32px 30px 26px;border-radius:20px;
  background:rgba(255,255,255,.085);backdrop-filter:blur(22px) saturate(150%);
  border:1px solid rgba(255,255,255,.16);
  box-shadow:0 30px 80px -30px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.2)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.brand i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-style:normal;font-weight:700;
  background:linear-gradient(180deg,var(--accent),var(--accent-deep))}
.brand b{font-size:13.5px}.brand small{display:block;font-size:10px;letter-spacing:.16em;color:rgba(255,255,255,.45)}
h1{font-size:24px;letter-spacing:-.02em;margin-bottom:8px}
.lead{font-size:12.5px;line-height:1.7;color:rgba(255,255,255,.62);margin-bottom:20px}
.f{margin-bottom:14px}.f label{display:block;font-size:11.5px;color:rgba(255,255,255,.55);margin-bottom:7px}
.f input{width:100%;height:44px;border-radius:11px;border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.06);color:#fff;padding:0 13px;font-size:13px}
.f input::placeholder{color:rgba(255,255,255,.34)}
.f input:focus{outline:none;border-color:rgba(var(--accent-rgb),.75);background:rgba(255,255,255,.1)}
.row{display:flex;gap:8px}.row input{flex:1}
.code{height:44px;padding:0 14px;border-radius:11px;border:1px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.05);color:#fff;font-size:12.5px;white-space:nowrap;cursor:pointer}
.code:disabled{opacity:.45;cursor:default}
.submit{width:100%;height:46px;border-radius:12px;margin-top:8px;font-size:14px;cursor:pointer;border:0;
  color:var(--on-accent);background:linear-gradient(180deg,var(--accent),var(--accent-deep));
  box-shadow:0 14px 30px -14px rgba(var(--accent-rgb),.95)}
.hint{margin-top:15px;font-size:11.5px;line-height:1.7;color:rgba(255,255,255,.42)}
.foot{position:fixed;left:0;right:0;bottom:14px;text-align:center;font-size:11px;color:rgba(255,255,255,.3);z-index:2}
</style><script src="ui.js"></script><link rel="stylesheet" href="page.css"><link rel="stylesheet" href="visual.css"><link rel="stylesheet" href="polish.css">
<script src="motion.js"></script>
<script src="nav.js"></script>
</head>
<body>
<div class="halo"></div>
<div class="stage"><div class="card-login">
  <div class="brand"><i>轻</i><div><b>轻单</b><small>QINGDAN</small></div></div>
  <h1>登录</h1>
  <p class="lead">账号由管理员统一创建。用他给你的手机号登录，验证码点「获取验证码」。</p>
  <div class="f"><label for="p">手机号</label><input id="p" placeholder="请输入手机号"></div>
  <div class="f"><label for="c">验证码</label><div class="row"><input id="c" placeholder="6 位验证码"><button class="code" id="send">获取验证码</button></div></div>
  <button class="submit">登录</button>
  <p class="hint">企业注册与入企一期暂未开放。<br>收不到验证码，把手机号发给管理员，他能查到这一次请求。</p>
</div></div>
<div class="foot">轻单 v0.10 · 设计稿 · 演示数据</div>
<script>
var b=document.getElementById('send'),n=60,t=null;
b.onclick=function(){b.disabled=true;b.textContent=n+' 秒后重发';t=setInterval(function(){n--;if(n<=0){clearInterval(t);b.disabled=false;b.textContent='获取验证码';n=60}else b.textContent=n+' 秒后重发';},1000);};
</script></body></html>
