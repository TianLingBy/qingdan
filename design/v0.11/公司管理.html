<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);font-size:13.5px;line-height:1.65;color:var(--text-1);
  background:var(--bg-0);-webkit-font-smoothing:antialiased;display:flex;min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.sidebar{width:236px;flex:none;background:var(--surf-1);border-right:1px solid var(--line-1);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.sb-nav{overflow-y:auto;padding:8px 8px 14px}
.sb-domain{font-size:11px;letter-spacing:.06em;color:var(--text-decor);padding:12px 10px 4px}
.sb-link{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:5px 10px;border-radius:6px}
.sb-link svg{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:1.4;opacity:.55}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:10;background:var(--topbar-bg);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line-1);display:flex;align-items:center;justify-content:space-between;
  gap:16px;padding:0 28px;height:52px}
.crumb{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-3)}
.crumb .cur{color:var(--text-1)}
.crumb .sep{color:var(--text-decor)}
.snapshot{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--text-3)}
.snapshot b{color:var(--text-1);font-weight:600}
.wrap{padding:28px 28px 40px;max-width:1320px;width:100%}
.p-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:18px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-decor);margin-bottom:6px}
.p-head h1{font-size:22px;letter-spacing:-.02em;font-weight:650}
.p-head .sub{margin-top:8px;font-size:13px;color:var(--text-2);max-width:62ch}
.actions{display:flex;gap:10px;align-items:center}
.btn,.btn-primary{height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line-2);
  font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--accent-deep);color:var(--on-accent);border-color:transparent}
.p-filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.seg{display:flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.seg button{padding:6px 12px;font-size:12.5px;color:var(--text-2);border-right:1px solid var(--line-1)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--surf-2);color:var(--text-1);font-weight:550}
.search{height:32px;min-width:220px;padding:0 12px;border-radius:8px;border:1px solid var(--line-2);
  background:var(--surf-1);color:var(--text-2);font-size:12.5px}
.card{background:var(--surf-1);border:1px solid var(--line-1);border-radius:12px;overflow:hidden;box-shadow:var(--sh-1)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{position:sticky;top:0;background:var(--surf-2);color:var(--text-2);font-weight:550;
  text-align:left;padding:10px 14px;border-bottom:1px solid var(--line-1);white-space:nowrap}
tbody td{padding:11px 14px;border-bottom:1px solid var(--line-1);color:var(--text-1);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surf-2)}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.st{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;
  border:1px solid var(--line-2);font-size:11.5px;color:var(--text-2)}
.st.ok{color:var(--ok);border-color:var(--ok)}
.st.warn{color:var(--accent-light);border-color:var(--a-28);background:var(--a-10)}
.st.bad{color:var(--danger);border-color:var(--danger)}
.note{margin-top:12px;font-size:12px;color:var(--text-3)}
.foot{margin-top:auto;padding:16px 28px;border-top:1px solid var(--line-1);font-size:11.5px;color:var(--text-decor)}
</style>
