openapi: 3.1.0

info:
  title: 轻单开放 API（Qingdan API v1）
  version: 0.1.0-draft
  summary: AI 友好型应用的接口骨架：Web / CLI / MCP 共用同一套 REST 接口（D52）
  description: |
    **状态：草案骨架（0.1.0-draft）。** 本文件与《轻单_接口契约第三批_v1_20261104.md》同批冻
    结；第三批 §5 的 4 项开放项确认前，本文件不作为实现依据。

    **真源**：
    - `docs/轻单_接口契约第三批_v1_20261104.md`（操作日志 §1 / API Token §2 / 通用 API 约定 §3 / CLI 与 MCP §4）
    - `docs/轻单_接口契约第一批_v1_20261103.md`（编号与权限 §1、A 单 §3.1、E 单 §3.3、C 单 §3.4、收款记录 §6、批次 §7、库存流水 §8）
    - `docs/decisions.md` D51（操作日志）/ D52（API-first）/ D52.1（AI 权限不可放大）

    **通用约定（契约第三批 §3）**：
    - 认证：人类 = 会话 Cookie；机器 = `Authorization: Bearer <token>`；二选一。
    - 错误体：`{ code, message, details, requestId }`，HTTP 状态码与 `code` 同时给。
    - 分页：`cursor` / `limit`（默认 50、最大 200），返回 `nextCursor`。
    - 幂等：写接口支持 `Idempotency-Key`，24h 内重复请求返回首次结果。
    - 并发：单据/批次写接口要求 `If-Match: <version>`，冲突返回 409。
    - 预检：写接口支持 `dryRun=true`（只校验不落库）。
    - 请求 id：`X-Request-Id` 透传并回写，缺省由服务端生成。
    - 时间 ISO 8601 带时区；金额、数量一律 decimal **字符串**（避免浮点误差）。

    **本骨架的命名决策（契约未规定，需 platform 冻结时一并确认，详见交付报告）**：
    1. JSON 键名统一 camelCase；契约 §1 的中文字段名到 JSON 键的映射见下表。
    2. 业务状态枚举保持契约原值：`进行中 / 已完成 / 已取消`、`待确认 / 已结算`、`收款 / 退款`。
    3. Token scope 的动作采用英文：查=read、建=create、编=update、审=approve、出库=ship、
       删=delete、看价=view_price、导出=export（契约只给中文动作名，`sales.create` 等示例为英文动词）。
    4. 错误码 `code` 的枚举为**提案**：契约只约定错误体结构，未枚举 code。
    5. 扩展端点（auth / settlement-orders / batches / inventory-transactions / employees）契约未定义
       REST 路径，路径与字段按第一批 §2/§6/§7/§8 映射，命名待 platform 冻结。

    **审计字段映射（契约第三批 §1 → JSON 键）**：

    | 契约字段 | JSON 键 | 契约字段 | JSON 键 |
    |---|---|---|---|
    | id | id | 时间 | occurredAt |
    | 租户 id | tenantId | 公司 id | companyId |
    | 操作者类型 | actorType | 操作者 id | actorId |
    | 凭证 id | credentialId | 来源 | source |
    | 动作 | action | 对象类型 | objectType |
    | 对象 id | objectId | 变更摘要 | changes |
    | 结果 | result | 错误码 | errorCode |
    | 请求 id | requestId | IP / UA | ip / userAgent |
    | 原因 | reason | 业务事务 id | businessTxnId |

    **写端点扩展字段（实现约束）**：
    - `x-scope`：调用所需 scope（功能域 × 动作），AI 生效权限 = 绑定员工当前权限 ∩ scope（D52.1）。
    - `x-audit`：必须落操作日志（D51）；`kind: write|read`，`logOnFailure: true` 表示失败也记，
      `reason: required|conditional|optional` 对应契约 §1「原因」的必填规则。
    - `x-ai-policy`：`allowed` / `forbidden-by-default`（危险动作默认拒绝 AI，D52①）。
    - `x-idempotency`：幂等窗口（写接口 24h）。
  contact:
    name: 轻单项目组
  license:
    name: 私有项目（未开源）

servers:
  - url: /api/v1
    description: 同源相对路径（Web / CLI / MCP 共用；契约第三批 §3「版本」）

security:
  - sessionCookie: []
  - bearerToken: []

tags:
  - name: meta
    description: 接口真源与版本
  - name: auth
    description: 登录 / 登出 / 当前身份
  - name: audit
    description: 操作日志（只追加，D51）
  - name: token
    description: API Token（机器身份，契约第三批 §2）
  - name: purchase
    description: A 采购单（契约第一批 §3.1）
  - name: sales
    description: E 销售单与收款记录（契约第一批 §3.3 / §6）
  - name: settlement
    description: C 结算单（契约第一批 §3.4）
  - name: inventory
    description: 批次与库存流水（契约第一批 §7 / §8）
  - name: permission
    description: 员工与权限（D15 / D50）

paths:

  /openapi.json:
    get:
      tags: [meta]
      operationId: getOpenApiDocument
      summary: 获取本部署的 OpenAPI 3.1 文档
      description: 契约第三批 §3「文档」：OpenAPI 3.1 是唯一接口真源。返回本 YAML 转换后的 JSON。
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: OpenAPI 3.1 文档（JSON）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-audit:
        required: false
        note: 读取接口文档不记日志（D51① 默认值）

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: 登录（手机号 + 验证码）
      description: |
        人类登录；成功后通过 `Set-Cookie` 发放会话 Cookie（`sessionCookie`）。
        失败登录同样落操作日志（D51 覆盖清单：失败登录）。
        AI 不走本接口，AI 用 `Authorization: Bearer <token>`。
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功，返回身份并设置会话 Cookie
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Set-Cookie:
              description: '`qingdan_session=<opaque>`；HttpOnly; Secure; SameSite=Lax（Cookie 名待 platform 冻结）'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
              example:
                employeeId: 0b8f1d3e-6a2c-4c5e-9f10-1a2b3c4d5e6f
                tenantId: 7d1c2b3a-4e5f-4a6b-8c9d-0e1f2a3b4c5d
                name: 张三
                companyIds:
                  - 11111111-2222-4333-8444-555555555555
                permissions:
                  purchase: [read, create]
                  sales: [read, create, update]
                credentialType: session
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-scope: []
      x-audit:
        required: true
        kind: write
        action: platform.auth.login
        objectType: 会话
        logOnFailure: true
        reason: optional
      x-ai-policy: not-applicable
      x-contract: 第三批 §1 覆盖清单（失败登录）

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: 登出（当前会话失效）
      description: 会话 Cookie 失效；操作日志记一条 `platform.auth.logout`。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '204':
          description: 已登出（无响应体）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-scope: []
      x-audit:
        required: true
        kind: write
        action: platform.auth.logout
        objectType: 会话
        logOnFailure: false
        reason: optional
      x-ai-policy: not-applicable

  /auth/me:
    get:
      tags: [auth]
      operationId: getCurrentIdentity
      summary: 当前身份与生效权限
      description: |
        返回当前凭证对应的员工、公司集合与生效权限。
        权限为服务端每次请求实时计算（D52.1②），客户端**不得**缓存用于鉴权。
        AI 调用时生效权限 = 绑定员工当前权限 ∩ token scope。
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: 当前身份
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-audit:
        required: false
        note: 普通身份查询不记日志
      x-contract: D52.1②

  /audit-logs:
    get:
      tags: [audit]
      operationId: listAuditLogs
      summary: 查询操作日志（只读、只追加）
      description: |
        契约第三批 §1。日志只追加，不提供更新 / 删除接口。
        金额与成本字段按「看价」权限脱敏（D27）。
        「查看操作日志」本身也记一条读日志（D51 覆盖清单）。
        普通列表 / 详情查询默认不记日志（D51① 拟定默认，待冻结）。
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: actorType
          in: query
          required: false
          description: 操作者类型（`platform` 平台开发者 / `employee` 员工 / `ai` AI / `system` 系统任务）
          schema:
            $ref: '#/components/schemas/ActorType'
        - name: source
          in: query
          required: false
          description: 来源（`web` / `cli` / `api` / `mcp` / `job`）
          schema:
            $ref: '#/components/schemas/RequestSource'
        - name: action
          in: query
          required: false
          description: 动作，`功能域.动作`，如 `sales.create`、`settlement.confirm`
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_-]*\.[a-z][a-z0-9_.-]*$'
        - name: result
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AuditResult'
        - name: from
          in: query
          required: false
          description: 时间下限（含），ISO 8601 带时区
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: 时间上限（含），ISO 8601 带时区
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 操作日志分页结果（按 occurredAt 倒序）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-scope: [platform.read]
      x-audit:
        required: true
        kind: read
        action: platform.audit.read
        objectType: 操作日志
        logOnFailure: false
        reason: optional
      x-ai-policy: allowed
      x-contract: 第三批 §1、D51

  /api-tokens:
    get:
      tags: [token]
      operationId: listApiTokens
      summary: 列出当前租户的 API Token（永不含明文）
      description: 明文 token 只在创建时返回一次，此后任何接口都不返回（契约第三批 §2）。
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ApiTokenStatus'
        - name: employeeId
          in: query
          required: false
          description: 按绑定员工过滤
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Token 分页结果
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-scope: [platform.read]
      x-audit:
        required: false
        note: Token 列表属敏感读，是否记日志见 D51① 待冻结
      x-ai-policy: allowed
      x-contract: 第三批 §2
    post:
      tags: [token]
      operationId: createApiToken
      summary: 创建 API Token（明文只返回一次）
      description: |
        契约第三批 §2 + D52.1①：scope 只能从创建人自己的授权里选，超出直接拒绝创建（422）；
        不提供租户级「上帝 token」（D52②）。
        AI 调用时需带 `reason`（意图说明），进操作日志。
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DryRun'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiTokenCreateRequest'
      responses:
        '201':
          description: 创建成功，返回含明文 token 的对象（仅此一次）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenCreated'
        '200':
          description: 'dryRun=true 时的预检结果（未落库）'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DryRunResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-scope: [platform.create]
      x-audit:
        required: true
        kind: write
        action: platform.token.create
        objectType: API Token
        logOnFailure: true
        reason: conditional
        note: AI 调用或涉及权限授予时必须带 reason
      x-ai-policy: allowed
      x-idempotency: 24h
      x-contract: 第三批 §2、D52.1①

  /api-tokens/{id}:
    delete:
      tags: [token]
      operationId: revokeApiToken
      summary: 撤销 API Token（危险动作，默认拒绝 AI）
      description: |
        撤销后 token 立即失效（契约第三批 §2「可随时撤销」）。
        删除类危险动作：`reason` 必填，进操作日志；AI 默认禁止直接执行（D52①）。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/Reason'
        - $ref: '#/components/parameters/DryRun'
      responses:
        '200':
          description: |
            正常：返回撤销后的 token（`status: revoked`）；
            `dryRun=true`：返回 `DryRunResult`（未落库）。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiToken'
                  - $ref: '#/components/schemas/DryRunResult'
                description: 由 `dryRun` 参数决定返回哪一个
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-scope: [platform.delete]
      x-audit:
        required: true
        kind: write
        action: platform.token.revoke
        objectType: API Token
        logOnFailure: true
        reason: required
      x-ai-policy: forbidden-by-default
      x-dangerous: true
      x-contract: 第三批 §1（危险动作）、§2、D52①

  /purchase-orders:
    get:
      tags: [purchase]
      operationId: listPurchaseOrders
      summary: 采购单列表（A 单）
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: supplierId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 采购单分页结果（只含当前员工公司集合内数据，D15）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-scope: [purchase.read]
      x-audit:
        required: false
      x-ai-policy: allowed
      x-contract: 第一批 §3.1
    post:
      tags: [purchase]
      operationId: createPurchaseOrder
      summary: 新建采购单（支持 dryRun）
      description: |
        契约第一批 §3.1：入库即锁批次价 `批次单价 = (货款 + 运费 + 杂费) ÷ 入库数量`（D5）。
        费用行金额可负（供应商返利等），负数必须填备注（D39）。
        `dryRun=true` 时只校验并返回将要发生的变更，不落库（契约第三批 §3「预检」）。
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DryRun'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderCreateRequest'
      responses:
        '201':
          description: 创建成功
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
        '200':
          description: 'dryRun=true 时的预检结果（未落库）'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DryRunResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-scope: [purchase.create]
      x-audit:
        required: true
        kind: write
        action: purchase.create
        objectType: 采购单
        logOnFailure: true
        reason: conditional
        note: AI 写操作必须带 reason（契约第三批 §1「原因」）
      x-ai-policy: allowed
      x-idempotency: 24h
      x-contract: 第一批 §3.1 / §5 / §7

  /purchase-orders/{id}:
    get:
      tags: [purchase]
      operationId: getPurchaseOrder
      summary: 采购单详情（A 单）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: 采购单详情
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
