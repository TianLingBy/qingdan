        reasonRequired: true
      x-mcp-tool: qingdan_platform_position_delete
      x-requires-if-match: true
  /api/v1/companies:
    get:
      operationId: platform.company.list
      summary: 公司列表（分页；普通读不记审计）
      tags:
        - company
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
