      x-mcp-tool: qingdan_platform_company_list
    post:
      operationId: platform.company.create
      summary: 新建公司（公司码由服务端按 D16 自动发放；AI 默认禁止）
      tags:
        - company
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters: []
      responses:
        "201":
          description: 成功
          content:
            application/json:
              schema:
