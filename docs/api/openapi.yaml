components:

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: qingdan_session
      description: |
        人类会话 Cookie（契约第三批 §3「认证」）。
        Cookie 名 `qingdan_session` 为骨架拟定，待 platform 冻结；HttpOnly; Secure; SameSite=Lax。
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: API Token
      description: |
        机器身份：`Authorization: Bearer <token>`（契约第三批 §2 / §3）。
        token 绑定员工，生效权限 = 员工当前权限 ∩ token scope（D52.1），每次请求重算、不缓存。

  parameters:
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: 客户端请求关联 id；服务端透传并回写，缺省则生成（契约第三批 §3）
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 写接口幂等键；24h 内重复请求返回首次结果（契约第三批 §3）
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 单据/批次写接口的乐观锁版本（取上次响应的 ETag / `version`）；冲突 409（契约第三批 §3）
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      description: 游标分页游标；缺省从第一页开始
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: 每页条数，默认 50、最大 200（契约第三批 §3）
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    DryRun:
      name: dryRun
      in: query
      required: false
      description: '`true` = 只校验不落库，返回 DryRunResult（契约第三批 §3「预检」）'
      schema:
        type: boolean
        default: false
    Reason:
      name: reason
      in: query
      required: true
      description: 危险动作的原因，进操作日志（契约第三批 §1「原因」）
      schema:
        type: string
        minLength: 1

  headers:
    XRequestId:
      description: 服务端回写的请求 id（缺省时由服务端生成）
      schema:
        type: string
    ETag:
      description: 资源版本，对应响应体 `version`；下次写请求放进 `If-Match`
      schema:
        type: string
    RetryAfter:
      description: 限流后建议重试的秒数（429，契约第三批 §2）
      schema:
        type: integer

  responses:
    Unauthorized:
      description: 未认证：会话失效或 Token 无效 / 已撤销 / 已过期。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHENTICATED
            message: 未登录或会话已失效
            details: {}
            requestId: req_01J0EXAMPLE000000000000000
    Forbidden:
      description: |
        无权限（scope 不足 / 公司数据隔离 / 危险动作拒绝 AI）。
        危险动作拒绝 AI 时 `code = AI_ACTION_FORBIDDEN`（D52①）。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            scopeDenied:
              summary: scope 不足
              value:
                code: FORBIDDEN
                message: 当前凭证无此操作权限
                details:
                  requiredScope: sales.approve
                requestId: req_01J0EXAMPLE000000000000001
            aiDenied:
              summary: AI 危险动作默认拒绝
              value:
                code: AI_ACTION_FORBIDDEN
                message: 危险动作默认禁止 AI 执行（D52①）
                details:
                  action: sales.complete
                  policy: forbidden-by-default
                requestId: req_01J0EXAMPLE000000000000002
    NotFound:
      description: 资源不存在或不在当前员工可见范围内（不泄露存在性）。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: 资源不存在
            details: {}
            requestId: req_01J0EXAMPLE000000000000003
    Conflict:
      description: |
        并发冲突或幂等键冲突：
        `VERSION_CONFLICT`（If-Match 版本不匹配，409）、
        `IDEMPOTENCY_CONFLICT`（同一 Idempotency-Key 复用于不同请求体）。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VERSION_CONFLICT
            message: 单据已被他人修改，请刷新后重试
            details:
              expectedVersion: 3
              currentVersion: 4
            requestId: req_01J0EXAMPLE000000000000004
    PreconditionRequired:
      description: 缺少 `If-Match`（单据/批次写接口要求乐观锁，契约第三批 §3）。提案状态码，待 platform 冻结。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: PRECONDITION_REQUIRED
            message: 该接口要求 If-Match
            details: {}
            requestId: req_01J0EXAMPLE000000000000005
    UnprocessableEntity:
      description: 校验失败（字段级错误见 `details.issues`；`dryRun` 只读校验也用它表达不可执行）。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VALIDATION_FAILED
            message: 参数校验失败
            details:
              issues:
                - field: lines[0].quantity
                  code: MUST_BE_POSITIVE
                  message: 数量必须大于 0
            requestId: req_01J0EXAMPLE000000000000006
    TooManyRequests:
      description: 超过限流（每 token / 每会话限流，契约第三批 §2）。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: RATE_LIMITED
            message: 请求过于频繁，请稍后重试
            details:
              retryAfterSeconds: 30
            requestId: req_01J0EXAMPLE000000000000007
    InternalServerError:
      description: 服务端未分类错误（审计仍会落 fail 记录，D51）。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INTERNAL_ERROR
            message: 服务端内部错误
            details: {}
            requestId: req_01J0EXAMPLE000000000000008

  schemas:

    Error:
      type: object
      description: 统一错误体（契约第三批 §3）。
      required: [code, message, requestId]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        details:
          type: object
          additionalProperties: true
          default: {}
          description: 附加信息（字段级 issues、冲突版本等）
        requestId:
          type: string
          description: 与响应头 `X-Request-Id` 一致

    ErrorCode:
      type: string
      description: |
        错误码提案：契约第三批 §3 只约定错误体结构，未枚举 `code`；以下为骨架提案，待 platform 冻结。
      enum:
        - UNAUTHENTICATED
        - FORBIDDEN
        - AI_ACTION_FORBIDDEN
        - NOT_FOUND
        - VALIDATION_FAILED
        - VERSION_CONFLICT
        - IDEMPOTENCY_CONFLICT
        - PRECONDITION_REQUIRED
        - RATE_LIMITED
        - INTERNAL_ERROR

    ValidationIssue:
      type: object
      required: [code, message]
      properties:
        field:
          type: string
          description: JSON Pointer 或字段名，如 `lines[0].quantity`
        code:
          type: string
          description: 字段级错误码（提案，如 MUST_BE_POSITIVE）
        message:
          type: string

    DryRunResult:
      type: object
      description: 写接口 `dryRun=true` 的预检结果（只校验不落库，契约第三批 §3）。
      required: [dryRun, valid]
      properties:
        dryRun:
          type: boolean
          const: true
        valid:
          type: boolean
          description: 是否可执行；false 时看 errors
        changes:
          type: array
          description: 将要发生的变更（实体 + 操作，具体形状待 platform 冻结）
          items:
            type: object
            additionalProperties: true
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'

    ActorType:
      type: string
      description: 操作者类型（契约第三批 §1，原值为英文枚举）
      enum:
        - platform
        - employee
        - ai
        - system

    RequestSource:
      type: string
      description: 请求来源（契约第三批 §1）
      enum:
        - web
        - cli
        - api
        - mcp
        - job

    AuditResult:
      type: string
      enum:
        - success
        - fail

    ScopeAction:
      type: string
      description: |
        8 动作枚举（契约第一批 §1.2：查 / 建 / 编 / 审 / 出库 / 删 / 看价 / 导出）。
        契约只给中文动作名（示例 `sales.create` 只出现英文动词），英文映射为骨架拟定，待冻结：
        查=read、建=create、编=update、审=approve、出库=ship、删=delete、看价=view_price、导出=export。
      enum:
        - read
        - create
        - update
        - approve
        - ship
        - delete
        - view_price
        - export

    Scope:
      type: object
      description: |
        Token scope = 功能域 × 动作子集（契约第三批 §2 / 第一批 §1.2）。
        键为功能域（如 `purchase` / `sales` / `settlement` / `inventory` / `platform`），值为动作数组。
        AI 生效权限 = 绑定员工当前权限 ∩ scope（D52.1②）。
      additionalProperties:
        type: array
        items:
          $ref: '#/components/schemas/ScopeAction'
      examples:
        - purchase: [read, create]
          sales: [read, create, view_price]

    AuditLog:
      type: object
      description: |
        操作日志（契约第三批 §1）。只追加、不可改删；业务失败也记（D51）。
        JSON 键名映射见 info.description 的「审计字段映射」表。
      required:
        - id
        - occurredAt
        - tenantId
        - actorType
        - actorId
        - source
        - action
        - objectType
        - result
        - requestId
      properties:
        id:
          type: string
          format: uuid
          description: 契约「id」：日志主键，全局唯一
        occurredAt:
          type: string
          format: date-time
          description: 契约「时间」：服务端时间（UTC 存储，按租户时区展示）
        tenantId:
          type: [string, 'null']
          format: uuid
          description: |
            契约「租户 id」：平台侧操作可空（平台级）。
            ⚠️ 契约 §1 表列为必填、说明写「平台侧可空」，本骨架按说明允许 null，待契约冻结时裁决。
        companyId:
          type: [string, 'null']
          format: uuid
          description: 契约「公司 id」：单据/档案类操作必填
        actorType:
          $ref: '#/components/schemas/ActorType'
        actorId:
          type: string
          description: 契约「操作者 id」：员工 id 或平台账号 id；`system` 用固定标识（契约标 uuid，system 例外）
        credentialId:
          type: [string, 'null']
          format: uuid
          description: 契约「凭证 id」：AI 调用时为 token id；人类会话可记 session id
        source:
          $ref: '#/components/schemas/RequestSource'
        action:
          type: string
          description: 契约「动作」：`功能域.动作`，如 `sales.create`、`settlement.confirm`
          pattern: '^[a-z][a-z0-9_-]*\.[a-z][a-z0-9_.-]*$'
        objectType:
          type: string
          description: 契约「对象类型」：单据/档案/权限/Token/日志 等
        objectId:
          type: [string, 'null']
          format: uuid
          description: 契约「对象 id」：目标实体主键
        changes:
          type: [object, 'null']
          additionalProperties: true
          description: 契约「变更摘要」：变更前/后关键字段；金额与成本按「看价」权限脱敏（D27）
        result:
          $ref: '#/components/schemas/AuditResult'
        errorCode:
          type: [string, 'null']
          description: 契约「错误码」：失败时填
        requestId:
          type: string
          description: 契约「请求 id」：透传 `X-Request-Id`，用于全链路关联
        ip:
          type: [string, 'null']
          description: 契约「IP / UA」：来源 IP
        userAgent:
          type: [string, 'null']
          description: 契约「IP / UA」：来源 UA
        reason:
          type: [string, 'null']
          description: |
            契约「原因」：条件必填——危险动作（删除 / 冲正 / 成本更正 / 结算确认 / 权限变更）
            与 AI 写操作必填。
        businessTxnId:
          type: [string, 'null']
          description: 契约「业务事务 id」：与业务写入关联，便于对账

    AuditLogPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
        nextCursor:
          type: [string, 'null']
          description: 下一页游标；null 表示最后一页（契约第三批 §3 分页）

    ApiTokenStatus:
      type: string
      description: Token 状态（契约第三批 §2）
      enum:
        - active
        - revoked
        - expired

    ApiToken:
      type: object
      description: API Token（契约第三批 §2）。任何接口都不返回明文，明文只在创建时返回一次。
      required:
        - id
        - tenantId
        - employeeId
        - name
        - scope
        - status
        - createdBy
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
          description: 绑定员工 id（含专门创建的服务账号员工）
        name:
          type: string
          description: 名称：便于识别人 / Agent / 系统
        scope:
          $ref: '#/components/schemas/Scope'
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: 有效期；到期自动失效（status → expired）
        ipAllowlist:
          type: [array, 'null']
          description: IP 白名单；空 = 不限制
          items:
            type: string
        lastUsedAt:
          type: [string, 'null']
          format: date-time
          description: 最后使用时间（每次调用更新，异步，允许延迟）
        status:
          $ref: '#/components/schemas/ApiTokenStatus'
        createdBy:
          type: string
          format: uuid
          description: 创建人（员工 id）
        createdAt:
          type: string
          format: date-time
        revokedAt:
          type: [string, 'null']
          format: date-time
          description: 撤销时间

    ApiTokenCreateRequest:
      type: object
      description: 创建 Token 请求。scope 只能从创建人自己的授权里选，超出直接拒绝（D52.1①）。
      required: [name, employeeId, scope]
      properties:
        name:
          type: string
          minLength: 1
        employeeId:
          type: string
          format: uuid
          description: 绑定员工 id（服务账号员工须预先创建）
        scope:
          $ref: '#/components/schemas/Scope'
        expiresAt:
          type: [string, 'null']
          format: date-time
        ipAllowlist:
          type: [array, 'null']
          items:
            type: string
        reason:
          type: [string, 'null']
          description: 条件必填：AI 调用或涉及权限授予时必须填写（进操作日志）

    ApiTokenCreated:
      allOf:
        - $ref: '#/components/schemas/ApiToken'
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: 明文 token，**仅此一次**返回；服务端只存哈希（契约第三批 §2）

    ApiTokenPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApiToken'
        nextCursor:
          type: [string, 'null']

    DecimalString:
      type: string
      description: decimal 字符串（契约第三批 §3：金额 decimal 字符串，避免浮点误差）
      pattern: '^-?\d{1,15}(\.\d{1,6})?$'

    OrderStatus:
      type: string
      description: 单头三态（契约第一批 §1.5 / §10，原值为中文枚举）
      enum:
        - 进行中
        - 已完成
        - 已取消

    SettlementStatus:
      type: string
      description: C 单状态（契约第一批 §3.4 / §10，原值为中文枚举）
      enum:
        - 待确认
        - 已结算

    SourceOrderType:
      type: string
      description: C 单来源单类型（契约第一批 §3.4：来源单 E 或 N）
      enum:
        - E
        - N

    ProductLine:
      type: object
      description: 商品明细（契约第一批 §5.1）。A 单入库时生成批次，故创建 A 单时 `batchIds` 可不传。
      required: [productId, quantity, unitPrice, amount]
      properties:
        productId:
          type: string
          format: uuid
        batchIds:
          type: array
          description: |
            引用批次 id[]（契约 §5.1 必填；§11 开放项 1 拟定「E/B 必须引用批次」）。
            A 单创建时批次尚未生成，可不传。
          items:
            type: string
            format: uuid
        quantity:
          $ref: '#/components/schemas/DecimalString'
        unitPrice:
          $ref: '#/components/schemas/DecimalString'
          description: 单价——A/B 单为成本，E 单为售价
        amount:
          $ref: '#/components/schemas/DecimalString'
          description: 金额 = 数量 × 单价（服务端复核）

    FeeLine:
      type: object
      description: |
        费用明细（契约第一批 §5.2）。金额：E/B 单 ≥ 0；A 单可负（负数须填备注，D39）。
      required: [item, quantity, unitPrice, amount]
      properties:
        item:
          type: string
          description: 费用项：运费 / 杂费 / 加工费等
        quantity:
          $ref: '#/components/schemas/DecimalString'
        unitPrice:
          $ref: '#/components/schemas/DecimalString'
        amount:
          $ref: '#/components/schemas/DecimalString'
        note:
          type: [string, 'null']
          description: 备注；A 单负数费用必填（D39）

    PurchaseOrder:
      type: object
      description: A 采购单（契约第一批 §3.1）。入库即锁批次价，成本更正按 T1/T2/T3（D37）。
      required:
        - id
        - code
        - companyId
        - supplierId
        - handlerId
        - status
        - lines
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: 单号，结构 `类型字母-公司码(4)-日期(8)-流水(4)`（D16，如 `A-0001-20261103-0001`）
          pattern: '^[ABENCRSI]-\d{4}-\d{8}-\d{4}$'
        companyId:
          type: string
          format: uuid
          description: 公司归属（数据隔离 D15；契约单头字段表未单列，由单号公司码派生）
        supplierId:
          type: string
          format: uuid
        handlerId:
          type: string
          format: uuid
          description: 经手人
        status:
          $ref: '#/components/schemas/OrderStatus'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/ProductLine'
        feeLines:
          type: array
          items:
            $ref: '#/components/schemas/FeeLine'
        remark:
          type: [string, 'null']
        version:
          type: integer
          minimum: 1
          description: 乐观锁版本（对应 ETag / If-Match，契约第三批 §3 并发）
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PurchaseOrderCreateRequest:
      type: object
      required: [supplierId, handlerId, lines]
      properties:
        companyId:
          type: string
          format: uuid
          description: 公司归属；缺省取当前员工唯一绑定公司（多公司时必须显式传）
        supplierId:
          type: string
          format: uuid
        handlerId:
          type: string
          format: uuid
          description: 经手人
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProductLine'
        feeLines:
          type: array
          items:
            $ref: '#/components/schemas/FeeLine'
        remark:
          type: [string, 'null']
        reason:
          type: [string, 'null']
          description: 条件必填：AI 写操作必须填写（契约第三批 §1「原因」）

    PurchaseOrderPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseOrder'
        nextCursor:
          type: [string, 'null']

    SalesOrder:
      type: object
      description: E 销售单（契约第一批 §3.3）；详情内嵌收款记录（§6）。
      required:
        - id
        - code
        - companyId
        - customerId
        - handlerId
        - status
        - lines
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: 单号（D16，如 `E-0001-20261103-0001`）
          pattern: '^[ABENCRSI]-\d{4}-\d{8}-\d{4}$'
        companyId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        handlerId:
          type: string
          format: uuid
          description: 经手人；业务归属挂 E 单负责人（F5）
        status:
          $ref: '#/components/schemas/OrderStatus'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/ProductLine'
        feeLines:
          type: array
          description: 费用行一律 ≥ 0（D39）
          items:
            $ref: '#/components/schemas/FeeLine'
        receipts:
          type: array
          description: 收款记录（详情内嵌块，契约第一批 §6）
          items:
            $ref: '#/components/schemas/Receipt'
        remark:
          type: [string, 'null']
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SalesOrderCreateRequest:
      type: object
      required: [customerId, handlerId, lines]
      properties:
        companyId:
          type: string
          format: uuid
          description: 公司归属；缺省取当前员工唯一绑定公司
        customerId:
          type: string
          format: uuid
        handlerId:
          type: string
          format: uuid
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProductLine'
        feeLines:
          type: array
          items:
            $ref: '#/components/schemas/FeeLine'
        remark:
          type: [string, 'null']
        reason:
          type: [string, 'null']
          description: 条件必填：AI 写操作必须填写

    SalesOrderPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SalesOrder'
        nextCursor:
          type: [string, 'null']

    CompleteSalesOrderRequest:
      type: object
      description: 完成销售单（危险动作，reason 必填）。
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          description: 完成原因/意图，进操作日志（契约第三批 §1「原因」）

    SalesOrderCompleteResult:
      type: object
      description: 完成 E 单后的结果，含自动生成的 C 单草稿（D19/D29）。
      required: [order, settlementDraft, auditLogId]
      properties:
        order:
          $ref: '#/components/schemas/SalesOrder'
        settlementDraft:
          oneOf:
            - $ref: '#/components/schemas/SettlementOrder'
            - type: 'null'
          description: 自动生成的 C 单草稿（status = 待确认）；一期一单一次结算（D19）
        auditLogId:
          type: string
          format: uuid
          description: 本次操作的操作日志 id（D51）

    Receipt:
      type: object
      description: 收款记录（契约第一批 §6）。块内余额 = 收款合计 − 退款合计。
      required: [id, direction, amount, method, occurredAt]
      properties:
        id:
          type: string
          format: uuid
        direction:
          type: string
          enum:
            - 收款
            - 退款
          description: 方向：退款为负数行
        amount:
          $ref: '#/components/schemas/DecimalString'
          description: 金额；退款为负数
        method:
          type: string
          enum:
            - 在线支付回调
            - 线下转账
            - 原路退款
            - 冲抵应收
        occurredAt:
          type: string
          format: date-time
          description: 收款时间
        reversalOrderId:
          type: [string, 'null']
          format: uuid
          description: 关联冲正单（R 单，退款时选填）

    ReceiptCreateRequest:
      type: object
      required: [direction, amount, method, occurredAt]
      properties:
        direction:
          type: string
          enum:
            - 收款
            - 退款
        amount:
          $ref: '#/components/schemas/DecimalString'
          description: 退款必须为负数（D40）
        method:
          type: string
          enum:
            - 在线支付回调
            - 线下转账
            - 原路退款
            - 冲抵应收
        occurredAt:
          type: string
          format: date-time
        reversalOrderId:
          type: [string, 'null']
          format: uuid
        reason:
          type: [string, 'null']
          description: 条件必填：退款方向或 AI 写操作必须填写（D40 / D52①）

    SettlementOrder:
      type: object
      description: C 结算单（契约第一批 §3.4）。结算后不可冲正，走退货（D2③）。
      required:
        - id
        - code
        - sourceOrderType
        - sourceOrderId
        - status
        - totalSalePrice
        - totalCost
        - grossProfit
        - grossMargin
        - lossAmount
        - netProfit
        - commissionRateSnapshot
        - commissionAmount
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: 单号（D16，如 `C-0001-20261103-0001`）
          pattern: '^[ABENCRSI]-\d{4}-\d{8}-\d{4}$'
        sourceOrderType:
          $ref: '#/components/schemas/SourceOrderType'
        sourceOrderId:
          type: string
          format: uuid
          description: 来源单（E 或 N）
        status:
          $ref: '#/components/schemas/SettlementStatus'
        totalSalePrice:
          $ref: '#/components/schemas/DecimalString'
          description: 总售价
        totalCost:
          $ref: '#/components/schemas/DecimalString'
          description: 总成本
        grossProfit:
          $ref: '#/components/schemas/DecimalString'
          description: 毛利 = 总售价 − 总成本（D5）
        grossMargin:
          $ref: '#/components/schemas/DecimalString'
          description: 毛利率 = 毛利 ÷ 总售价
        lossAmount:
          $ref: '#/components/schemas/DecimalString'
          description: 本单相关损失（D33/D35/D43；金额受「看价」权限 D27）
        netProfit:
          $ref: '#/components/schemas/DecimalString'
          description: 净毛利 = 毛利 − 本单相关损失（D33）
        commissionRateSnapshot:
          $ref: '#/components/schemas/DecimalString'
          description: 提成比例快照（结算时快照，D36）
        commissionAmount:
          $ref: '#/components/schemas/DecimalString'
          description: 提成金额（一期仅报表数字，D11）
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SettlementOrderPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SettlementOrder'
        nextCursor:
          type: [string, 'null']

    ConfirmSettlementOrderRequest:
      type: object
      description: 结算确认（危险动作，reason 必填）。
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1

    Batch:
      type: object
      description: 批次（契约第一批 §7）。可用量 = 剩余量 − 在途占用 − 待执行占用，是唯一可引用数字。
      required:
        - id
        - batchNo
        - productId
        - companyId
        - custodianId
        - lockedUnitPrice
        - inboundQty
        - referencedQty
        - remainingQty
        - inTransitQty
        - pendingQty
        - availableQty
        - version
      properties:
        id:
          type: string
          format: uuid
        batchNo:
          type: string
          description: 批次号（系统自动取号，与商品经商品 id 关联，D49）
        productId:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
          description: 批次归属（D22）
        custodianId:
          type: string
          format: uuid
          description: 保管人（实物责任，F5）
        lockedUnitPrice:
          $ref: '#/components/schemas/DecimalString'
          description: 锁定单价（A 单入库或 B 单产出时锁定，D5；受「看价」权限 D27）
        inboundQty:
          $ref: '#/components/schemas/DecimalString'
        referencedQty:
          $ref: '#/components/schemas/DecimalString'
        remainingQty:
          $ref: '#/components/schemas/DecimalString'
        inTransitQty:
          $ref: '#/components/schemas/DecimalString'
          description: 在途占用（N 单在途锁定，D22/D31）
        pendingQty:
          $ref: '#/components/schemas/DecimalString'
          description: 待执行占用（D38/D41）
        availableQty:
          $ref: '#/components/schemas/DecimalString'
        version:
          type: integer
          minimum: 1

    BatchPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Batch'
        nextCursor:
          type: [string, 'null']

    InventoryTransaction:
      type: object
      description: 库存流水（契约第一批 §8）。只追加，与单据同事务（D2①）。
      required:
        - id
        - batchId
        - changeQty
        - sourceOrderId
        - handlerId
        - occurredAt
      properties:
        id:
          type: string
          format: uuid
        batchId:
          type: string
          format: uuid
        changeQty:
          $ref: '#/components/schemas/DecimalString'
          description: 变动量，正入负出
        sourceOrderId:
          type: string
          format: uuid
          description: 来源单据
        handlerId:
          type: string
          format: uuid
          description: 经手人
        occurredAt:
          type: string
          format: date-time

    InventoryTransactionPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InventoryTransaction'
        nextCursor:
          type: [string, 'null']

    CompanyGrant:
      type: object
      description: 员工-公司-岗位对（契约第一批 §2 / D15）。
      required: [companyId]
      properties:
        companyId:
          type: string
          format: uuid
        positionIds:
          type: array
          description: 岗位 id 集；权限 = 岗位并集（D15）
          items:
            type: string
            format: uuid

    PermissionOverride:
      type: object
      description: 个人权限覆盖（D50）。
      required: [domain, action, granted]
      properties:
        domain:
          type: string
          description: 功能域（D44），如 `purchase` / `sales` / `settlement`
        action:
          $ref: '#/components/schemas/ScopeAction'
        granted:
          type: boolean

    Employee:
      type: object
      description: 员工（契约第一批 §2）。权限 = 岗位并集 ⊕ 个人覆盖（D15/D50）。
      required: [id, employeeNo, name, companyGrants]
      properties:
        id:
          type: string
          format: uuid
        employeeNo:
          type: string
          description: 工号：定长 6 位、全租户唯一、不带公司前缀（D48）
          pattern: '^\d{6}$'
        name:
          type: string
        phone:
          type: string
          description: 账号（手机号，唯一）
          pattern: '^1\d{10}$'
        companyGrants:
          type: array
          items:
            $ref: '#/components/schemas/CompanyGrant'
        overrides:
          type: array
          description: 个人权限覆盖（D50）
          items:
            $ref: '#/components/schemas/PermissionOverride'

    EmployeePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Employee'
        nextCursor:
          type: [string, 'null']

    PermissionUpdateRequest:
      type: object
      description: |
        修改员工权限（D15 / D50）。契约未定义 REST 路径与请求体，本 schema 按 D50 拟定，待 platform 冻结。
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          description: 权限变更原因（危险动作必填，D52①）
        companyGrants:
          type: array
          description: 员工-公司-岗位对全集（替换语义，pending 冻结）
          items:
            $ref: '#/components/schemas/CompanyGrant'
        overrides:
          type: array
          description: 个人权限覆盖全集（替换语义，pending 冻结）
          items:
            $ref: '#/components/schemas/PermissionOverride'

    LoginRequest:
      type: object
      required: [phone, code]
      properties:
        phone:
          type: string
          description: 手机号
          pattern: '^1\d{10}$'
        code:
          type: string
          description: 短信验证码（6 位）
          pattern: '^\d{6}$'

    Identity:
      type: object
      description: 当前凭证的身份与生效权限（服务端实时计算，客户端不得缓存用于鉴权，D52.1②）。
      required: [employeeId, tenantId, name, companyIds, permissions, credentialType]
      properties:
        employeeId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        name:
          type: string
        companyIds:
          type: array
          description: 数据可见范围 = 绑定公司集合（D15）
          items:
            type: string
            format: uuid
        permissions:
          $ref: '#/components/schemas/Scope'
          description: 生效权限（岗位并集 ⊕ 个人覆盖；AI 再 ∩ token scope）
        credentialType:
          type: string
          enum:
            - session
            - token
          description: 凭证类型：session = 人类会话；token = API Token（机器/AI）
        tokenId:
          type: [string, 'null']
          format: uuid
          description: credentialType = token 时为 token id（对应审计「凭证 id」）
