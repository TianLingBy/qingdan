            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Company"
                  nextCursor:
                    anyOf:
                      - type: string
                        minLength: 1
                      - type: "null"
                required:
                  - items
