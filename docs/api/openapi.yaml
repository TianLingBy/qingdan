                additionalProperties: false
        default:
          description: 错误（统一错误体）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
      x-scope: company.read
      x-module: platform
      x-audit:
        kind: none
        required: false
      x-ai-policy:
        policy: allow
