openapi: 3.1.0
info:
  title: 轻单 API
  version: 1.0.0
  description: 接口真源由 packages/contracts 的 Zod 注册表发射（D52：OpenAPI 3.1，Web/CLI/MCP 同源）。
servers:
  - url: /
    description: 相对部署根；路径已含 /api/v1 前缀
tags:
  - name: purchase
    description: A 采购单
  - name: processing
    description: B 加工单
  - name: sales
    description: E 销售单
  - name: internal_trade
    description: N 内部交易
  - name: settlement
    description: C 结算单
  - name: commission
    description: 提成
  - name: customer_return
    description: R 客户退货
  - name: supplier_return
    description: S 供应商退货
  - name: stocktake
    description: 盘点调整 I
  - name: product
    description: 商品
  - name: customer
    description: 客户
  - name: supplier
    description: 供应商
  - name: processor
    description: 加工厂
  - name: inventory_qty
    description: 库存数量
  - name: inventory_flow
    description: 库存流水
  - name: stocktake_page
    description: 盘点
  - name: employee
    description: 员工
  - name: permission
    description: 权限设置
  - name: company
    description: 公司管理
  - name: profit_report
    description: 利润报表
  - name: audit
    description: 操作日志
  - name: api_integration
    description: API 与集成
paths:
  /api/v1/health:
    get:
      operationId: platform.health.read
      summary: 健康检查（不认证、不记审计）
      tags:
        - api_integration
      security: []
      parameters: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
                  version:
                    type: string
                required:
                  - status
                  - version
                additionalProperties: false
        default:
          description: 错误（统一错误体）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
      x-scope: api_integration.read
      x-module: platform
      x-audit:
        kind: none
        required: false
      x-ai-policy:
        policy: allow
        reasonRequired: false
      x-mcp-tool: qingdan_platform_health_read
  /api/v1/openapi.json:
    get:
      operationId: platform.openapi.read
      summary: OpenAPI 3.1 文档（接口真源，公开只读）
      tags:
        - api_integration
      security: []
      parameters: []
      responses:
        "200":
          description: 成功
        default:
          description: 错误（统一错误体）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
      x-scope: api_integration.read
      x-module: platform
      x-audit:
        kind: none
        required: false
      x-ai-policy:
        policy: allow
        reasonRequired: false
      x-mcp-tool: qingdan_platform_openapi_read
  /api/v1/auth/login:
    post:
      operationId: platform.auth.login
      summary: 手机号 + 验证码登录（一期不发码，账号由后台/初始化脚本创建）
      tags:
        - employee
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  employeeId:
                    type: string
                  tenantId:
                    type: string
                  displayName:
                    type: string
                required:
                  - employeeId
                  - tenantId
                  - displayName
                additionalProperties: false
        default:
          description: 错误（统一错误体）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
      x-scope: employee.read
      x-module: platform
      x-audit:
        kind: write
        required: true
      x-ai-policy:
        policy: forbid
        reasonRequired: false
      x-mcp-tool: qingdan_platform_auth_login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  minLength: 6
                  maxLength: 32
                code:
                  type: string
                  minLength: 1
                  maxLength: 16
              required:
                - phone
                - code
              additionalProperties: false
  /api/v1/auth/logout:
    post:
      operationId: platform.auth.logout
      summary: 登出（只失效当前会话）
      tags:
        - employee
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters: []
      responses:
        "201":
          description: 成功
        default:
          description: 错误（统一错误体）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
      x-scope: employee.read
      x-module: platform
      x-audit:
        kind: write
        required: true
      x-ai-policy:
        policy: forbid
        reasonRequired: false
      x-mcp-tool: qingdan_platform_auth_logout
  /api/v1/auth/me:
    get:
      operationId: platform.auth.me
      summary: 当前登录主体与生效权限
      tags:
        - employee
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  employeeId:
                    type: string
                  tenantId:
                    type: string
                  displayName:
                    type: string
                  companyIds:
                    type: array
                    items:
                      type: string
                  scope:
                    type: array
                    items:
                      type: object
                      properties:
                        domain:
                          type: string
                          enum:
                            - purchase
                            - processing
                            - sales
                            - internal_trade
                            - settlement
                            - commission
                            - customer_return
                            - supplier_return
                            - stocktake
                            - product
                            - customer
                            - supplier
                            - processor
                            - inventory_qty
                            - inventory_flow
                            - stocktake_page
                            - employee
                            - permission
                            - company
                            - profit_report
                            - audit
                            - api_integration
                        actions:
                          type: array
                          items:
                            type: string
                            enum:
                              - read
                              - create
                              - update
                              - approve
                              - ship
                              - delete
                              - view_price
                              - export
                      required:
                        - domain
                        - actions
                      additionalProperties: false
                required:
                  - employeeId
                  - tenantId
                  - displayName
                  - companyIds
                  - scope
                additionalProperties: false
        default:
          description: 错误（统一错误体）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
      x-scope: employee.read
      x-module: platform
      x-audit:
        kind: none
        required: false
      x-ai-policy:
        policy: allow
        reasonRequired: false
      x-mcp-tool: qingdan_platform_auth_me
  /api/v1/employees:
    get:
      operationId: platform.employee.read
      summary: 员工列表（普通读不记审计；老板见全租户，非老板仅绑定公司集合）
      tags:
        - employee
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            exclusiveMinimum: 0
            maximum: 200
        - name: companyId
          in: query
          required: false
          schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        - name: positionId
          in: query
          required: false
          schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - 在职
              - 停用
        - name: keyword
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/EmployeeSummary"
                  nextCursor:
                    anyOf:
                      - type: string
                        minLength: 1
                      - type: "null"
                required:
                  - items
                  - nextCursor
                additionalProperties: false
        default:
          description: 错误（统一错误体）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
      x-scope: employee.read
      x-module: platform
      x-audit:
        kind: none
        required: false
      x-ai-policy:
        policy: allow
        reasonRequired: false
      x-mcp-tool: qingdan_platform_employee_read
    post:
      operationId: platform.employee.create
      summary: 创建员工（工号由服务端按 D48 自动发放；建账号属危险动作，AI 默认禁止）
      tags:
        - employee
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters: []
      responses:
        "201":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        default:
          description: 错误（统一错误体）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
      x-scope: employee.create
      x-module: platform
      x-audit:
        kind: write
        required: true
      x-ai-policy:
        policy: forbid
        reasonRequired: false
      x-mcp-tool: qingdan_platform_employee_create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 64
                phone:
                  type: string
                  pattern: ^1[0-9]{10}$
                positionIds:
                  minItems: 1
                  type: array
                  items:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                companyIds:
                  minItems: 1
                  type: array
                  items:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                isOwner:
                  type: boolean
              required:
                - name
                - phone
                - positionIds
                - companyIds
              additionalProperties: false
  /api/v1/employees/{id}:
    patch:
      operationId: platform.employee.update
      summary: 修改员工（强 ETag If-Match；不可改 id / 工号；改 isOwner 仅限人类）
      tags:
        - employee
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        default:
          description: 错误（统一错误体）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
      x-scope: employee.update
      x-module: platform
      x-audit:
        kind: write
        required: true
      x-ai-policy:
        policy: allow
        reasonRequired: false
      x-mcp-tool: qingdan_platform_employee_update
      x-requires-if-match: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 64
                phone:
                  type: string
                  pattern: ^1[0-9]{10}$
                positionIds:
                  minItems: 1
                  type: array
                  items:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                companyIds:
                  minItems: 1
                  type: array
                  items:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                isOwner:
                  type: boolean
              additionalProperties: false
    delete:
      operationId: platform.employee.disable
      summary: 停用员工（软删除，不做物理删除；危险动作，AI 默认禁止）
      tags:
        - employee
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        default:
          description: 错误（统一错误体）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
      x-scope: employee.delete
      x-module: platform
      x-audit:
        kind: write
        required: true
      x-ai-policy:
        policy: forbid
        reasonRequired: true
      x-mcp-tool: qingdan_platform_employee_disable
      x-requires-if-match: true
  /api/v1/positions:
    get:
      operationId: platform.position.list
      summary: 岗位列表（分页；可按 presetKey 过滤，普通读不记审计）
      tags:
        - permission
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            exclusiveMinimum: 0
            maximum: 200
        - name: presetKey
          in: query
          required: false
          schema:
            type: string
            enum:
              - owner
              - manager
              - finance
              - sales
              - purchase
              - quality
              - picking
              - warehouse
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Position"
                  nextCursor:
                    anyOf:
                      - type: string
                        minLength: 1
                      - type: "null"
                required:
                  - items
                  - nextCursor
                additionalProperties: false
        default:
          description: 错误（统一错误体）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
      x-scope: permission.read
      x-module: platform
      x-audit:
        kind: none
        required: false
      x-ai-policy:
        policy: allow
        reasonRequired: false
      x-mcp-tool: qingdan_platform_position_list
    post:
      operationId: platform.position.create
      summary: 新建岗位（权限模板；presetKey 仅限服务端预设值或 null；AI 默认禁止）
      tags:
        - permission
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters: []
      responses:
        "201":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Position"
        default:
          description: 错误（统一错误体）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
      x-scope: permission.create
      x-module: platform
      x-audit:
        kind: write
        required: true
      x-ai-policy:
        policy: forbid
        reasonRequired: true
      x-mcp-tool: qingdan_platform_position_create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 64
                actions:
                  minItems: 1
                  type: array
                  items:
                    type: object
                    properties:
                      domain:
                        type: string
                        enum:
                          - purchase
                          - processing
                          - sales
                          - internal_trade
                          - settlement
                          - commission
                          - customer_return
                          - supplier_return
                          - stocktake
                          - product
                          - customer
                          - supplier
                          - processor
                          - inventory_qty
                          - inventory_flow
                          - stocktake_page
                          - employee
                          - permission
                          - company
                          - profit_report
                          - audit
                          - api_integration
                      actions:
                        minItems: 1
                        type: array
                        items:
                          type: string
                          enum:
                            - read
                            - create
                            - update
                            - approve
                            - ship
                            - delete
                            - export
                    required:
                      - domain
                      - actions
                    additionalProperties: false
                presetKey:
                  anyOf:
                    - type: string
                      enum:
                        - owner
                        - manager
                        - finance
                        - sales
                        - purchase
                        - quality
                        - picking
                        - warehouse
                    - type: "null"
              required:
                - name
                - actions
              additionalProperties: false
  /api/v1/positions/{id}:
    patch:
      operationId: platform.position.update
      summary: 修改岗位权限模板（强 ETag If-Match；不可改 presetKey；AI 默认禁止）
      tags:
        - permission
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Position"
        default:
          description: 错误（统一错误体）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
      x-scope: permission.update
      x-module: platform
      x-audit:
        kind: write
        required: true
      x-ai-policy:
        policy: forbid
        reasonRequired: true
      x-mcp-tool: qingdan_platform_position_update
      x-requires-if-match: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 64
                actions:
                  minItems: 1
                  type: array
                  items:
                    type: object
                    properties:
                      domain:
                        type: string
                        enum:
                          - purchase
                          - processing
                          - sales
                          - internal_trade
                          - settlement
                          - commission
                          - customer_return
                          - supplier_return
                          - stocktake
                          - product
                          - customer
                          - supplier
                          - processor
                          - inventory_qty
                          - inventory_flow
                          - stocktake_page
                          - employee
                          - permission
                          - company
                          - profit_report
                          - audit
                          - api_integration
                      actions:
                        minItems: 1
                        type: array
                        items:
                          type: string
                          enum:
                            - read
                            - create
                            - update
                            - approve
                            - ship
                            - delete
                            - export
                    required:
                      - domain
                      - actions
                    additionalProperties: false
              additionalProperties: false
    delete:
      operationId: platform.position.delete
      summary: 停用岗位（软删除；被员工占用的岗位不允许删；危险动作，AI 默认禁止）
      tags:
        - permission
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Position"
        default:
          description: 错误（统一错误体）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
      x-scope: permission.delete
      x-module: platform
      x-audit:
        kind: write
        required: true
      x-ai-policy:
        policy: forbid
        reasonRequired: true
      x-mcp-tool: qingdan_platform_position_delete
      x-requires-if-match: true
  /api/v1/companies:
    get:
      operationId: platform.company.list
      summary: 公司列表（分页；普通读不记审计）
      tags:
        - company
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            exclusiveMinimum: 0
            maximum: 200
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Company"
                  nextCursor:
                    anyOf:
                      - type: string
                        minLength: 1
                      - type: "null"
                required:
                  - items
                  - nextCursor
                additionalProperties: false
        default:
          description: 错误（统一错误体）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
      x-scope: company.read
      x-module: platform
      x-audit:
        kind: none
        required: false
      x-ai-policy:
        policy: allow
        reasonRequired: false
      x-mcp-tool: qingdan_platform_company_list
    post:
      operationId: platform.company.create
      summary: 新建公司（公司码由服务端按 D16 自动发放；AI 默认禁止）
      tags:
        - company
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters: []
      responses:
        "201":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        default:
          description: 错误（统一错误体）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
      x-scope: company.create
      x-module: platform
      x-audit:
        kind: write
