<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>轻单 · 可点击原型 v1（20 页新 IA）</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#fff; --line:#e3e6ea; --text:#1f2328; --dim:#6b7280;
    --brand:#2563eb; --brand-soft:#e8f0fe; --warn:#b45309; --warn-soft:#fef3c7;
    --ok:#15803d; --ok-soft:#dcfce7; --bad:#b91c1c; --bad-soft:#fee2e2;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg)}
  header{height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .logo{font-weight:700;font-size:15px;letter-spacing:.5px}
  .logo small{font-weight:400;color:var(--dim);margin-left:6px;font-size:12px}
  .grow{flex:1}
  .role-box{display:flex;align-items:center;gap:8px;font-size:13px}
  select{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font:inherit}
  .layout{display:flex;min-height:calc(100vh - 52px)}
  aside{width:204px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:12px 8px}
  .group{margin-bottom:10px}
  .group h4{margin:8px 8px 4px;font-size:11px;color:var(--dim);font-weight:600;letter-spacing:1px;display:flex;align-items:center;gap:4px;cursor:pointer;user-select:none;border-radius:4px;padding:2px 4px}
  .group h4:hover{background:var(--bg);color:var(--text)}
  .group h4 .arr{display:inline-block;width:10px;text-align:center;transition:transform .15s;font-size:10px}
  .group.collapsed h4 .arr{transform:rotate(-90deg)}
  .group .items{overflow:hidden}
  .group.collapsed .items{display:none}
  nav a{display:block;padding:7px 10px;border-radius:6px;color:var(--text);text-decoration:none;font-size:13px;cursor:pointer}
  nav a:hover{background:var(--bg)}
  nav a.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
  nav a.deny{color:#b6bcc4;cursor:not-allowed;text-decoration:line-through}
  main{flex:1;padding:20px 24px 60px;min-width:0}
  h1{font-size:19px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:12.5px;margin-bottom:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
  .kpi b{display:block;font-size:22px;line-height:1.2}
  .kpi span{color:var(--dim);font-size:12px}
  table{width:100%;border-collapse:collapse;background:var(--panel);font-size:13px}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{background:#fafbfc;color:var(--dim);font-weight:600;font-size:12px}
  tr:hover td{background:#fcfcfd}
  tr.clickable{cursor:pointer}
  tr.disabled td{color:#b6bcc4;background:#fafafa}
  .tag{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;background:var(--bg);border:1px solid var(--line)}
  .tag.draft{background:#f1f2f4}
  .tag.pending{background:var(--warn-soft);border-color:#fde68a;color:var(--warn)}
  .tag.doing{background:var(--brand-soft);border-color:#bfdbfe;color:var(--brand)}
  .tag.done{background:var(--ok-soft);border-color:#bbf7d0;color:var(--ok)}
  .tag.dead{background:var(--bad-soft);border-color:#fecaca;color:var(--bad)}
  button{font:inherit;padding:5px 11px;border-radius:6px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
  button:hover{background:var(--bg)}
  button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  button.primary:hover{filter:brightness(1.06)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .hint{background:var(--warn-soft);border:1px solid #fde68a;color:#78350f;border-radius:8px;padding:10px 12px;font-size:12.5px;margin-bottom:14px}
  .hint b{color:#7c2d12}
  .muted{color:var(--dim)}
  .modal-mask{position:fixed;inset:0;background:rgba(20,23,28,.42);display:flex;align-items:flex-start;justify-content:center;padding:48px 16px;z-index:50;overflow:auto}
  .modal{background:var(--panel);border-radius:10px;width:min(680px,100%);padding:18px 20px;box-shadow:0 12px 40px rgba(0,0,0,.18)}
  .modal h3{margin:0 0 2px;font-size:16px}
  .kv{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;font-size:13px;margin:12px 0}
  .kv dt{color:var(--dim)}
  .kv dd{margin:0}
  .modal footer{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
  .steps{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 0;padding:0;list-style:none}
  .steps li{padding:3px 10px;border-radius:20px;background:var(--bg);border:1px solid var(--line);font-size:12px;color:var(--dim)}
  .steps li.cur{background:var(--brand);border-color:var(--brand);color:#fff}
  .empty{padding:28px;text-align:center;color:var(--dim);background:var(--panel);border:1px dashed var(--line);border-radius:8px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .seg button{border:none;border-radius:0;padding:5px 12px}
  .seg button.on{background:var(--brand);color:#fff}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:900px){.two{grid-template-columns:1fr}}
  .money{font-variant-numeric:tabular-nums}
  .perm-toolbar{display:flex;align-items:center;gap:10px;margin:10px 0;flex-wrap:wrap}
  .perm-toolbar select{padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);font-size:14px}
  .perm-table{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
  .perm-table table{border-collapse:collapse;width:100%;min-width:640px}
  .perm-table th,.perm-table td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:center;font-size:12px}
  .perm-table .dom-name{text-align:left;font-weight:500;white-space:nowrap}
  .perm-table th{background:var(--panel);color:var(--dim);font-weight:600;position:sticky;top:0}
  .perm-table .chk-head{width:34px}
  .perm-table .chk-cell{width:34px}
  .perm-table input[type=checkbox]{width:16px;height:16px;cursor:pointer;accent-color:var(--brand)}
  .perm-table input[type=checkbox]:disabled{cursor:not-allowed;opacity:.4}
  .perm-table .na{color:var(--dim);opacity:.45;font-size:12px}
  .perm-table tr:hover td{background:var(--brand-soft)}
</style>
</head>
<body>
<header>
  <div class="logo">轻单<small>可点击原型 v1 · 20 页新 IA · 假数据</small></div>
  <div class="grow"></div>
  <div class="role-box">
    <span class="muted">以身份查看：</span>
    <select id="roleSel"></select>
  </div>
  <button id="btnHelp">原型说明</button>
</header>
<div class="layout">
  <aside><nav id="nav"></nav></aside>
  <main id="view"></main>
</div>

<script>
// ============ 岗位与功能域权限（D4/D44：预设岗位 + 功能域 × 动作） ============
// 8 岗位；动作 8 项：查/建/编/审/出/删/看价/导出
const ROLES = ['老板','经理','销售/售后','采购','质检','理货','拣货','财务'];

// 每个功能域的默认权限（按岗位）。这里用「动作集合」表达，原型按它渲染按钮显隐。
// 领域 key 对应 20 页 IA 的功能域（D44）。
const DOMAINS = {
  'a':    {label:'采购单 A'},
  'b':    {label:'加工单 B'},
  'e':    {label:'销售单 E'},
  'n':    {label:'内部交易单 N'},
  'c':    {label:'结算单 C'},
  'comm': {label:'提成'},
  'r':    {label:'客户退货 R'},
  's':    {label:'供应商退货 S'},
  'i':    {label:'盘点调整 I'},
  'prod': {label:'商品'},
  'cust': {label:'客户'},
  'supp': {label:'供应商'},
  'plant':{label:'加工厂'},
  'qty':  {label:'库存数量'},
  'flow': {label:'库存流水'},
  'stock':{label:'盘点'},
  'emp':  {label:'员工'},
  'perm': {label:'权限设置'},
  'co':   {label:'公司管理'},
  'profit':{label:'利润报表'}
};

// 岗位能力：动作集合。老板全权；经理近乎全权但「权限设置」由老板独占；其余按 D44/D47 落。
function capsOf(role, dom){
  const c = {view:false,create:false,edit:false,approve:false,ship:false,del:false,price:false,export:false};
  if(role === '老板') return Object.assign(c,{view:true,create:true,edit:true,approve:true,ship:true,del:true,price:true,export:true});
  const isMgr = role === '经理';
  // 财务：全部单据可读（D47），结算/提成/报表可操作，退货审批（D47），成本更正审批（D42）
  const isFin = role === '财务';
  const canPrice = (isMgr || isFin || role==='采购' || role==='销售/售后');
  // 仓库岗：只看库存 + 加工（D44/D47）
  const isWh = (role==='质检' || role==='理货' || role==='拣货');
  const allOp = isMgr || role==='老板';
  const mgrFin = (isMgr || isFin || role==='老板');
  switch(dom){
    case 'perm':   // 权限设置仅老板/经理
      c.view = (role==='老板'||isMgr); c.edit = role==='老板'; break;
    case 'profit': // 利润报表：财务/经理/老板可见并看价
      c.view = mgrFin; c.price = mgrFin; break;
    case 'c': // 结算单：财务主操，经理/老板可看
      c.view = mgrFin; c.edit = isFin; c.approve = isFin; c.price = mgrFin; break;
    case 'comm': // 提成：财务/经理/老板 + 销售/售后（看自己提成）
      c.view = (mgrFin || role==='销售/售后'); c.edit = isFin; c.approve = isFin; c.price = mgrFin; break;
    case 'a': // 采购单：采购/经理/财务/老板可见；采购可建可编，经理/财务可审
      c.view = (role==='采购'||isMgr||isFin||role==='老板'); c.create = (role==='采购'||allOp); c.edit = (role==='采购'||allOp); c.approve = (isMgr||isFin||role==='老板'); c.price = canPrice; break;
    case 'b': // 加工单：销售/经理/老板 + 仓库岗可见；销售可建，仓库岗只读
      c.view = (role==='销售/售后'||isWh||isMgr||role==='老板'); c.create = (role==='销售/售后'||allOp); c.edit = (role==='销售/售后'||allOp); c.approve = allOp; c.price = canPrice; break;
    case 'e': // 销售单：销售/经理/财务/老板可见；销售可建编，破下限需审批（经理/老板）
      c.view = (role==='销售/售后'||isMgr||isFin||role==='老板'); c.create = (role==='销售/售后'||allOp); c.edit = (role==='销售/售后'||allOp); c.approve = (isMgr||role==='老板'); c.price = canPrice; break;
    case 'n': // 内部交易：销售/经理/老板可见
      c.view = (role==='销售/售后'||isMgr||role==='老板'); c.create = (role==='销售/售后'||allOp); c.edit = (role==='销售/售后'||allOp); c.price = canPrice; break;
    case 'r': // 客户退货：销售/财务/经理/老板可见；多岗可录，录入需审批（老板/经理/财务 D47）
      c.view = (role==='销售/售后'||isMgr||isFin||role==='老板'); c.create = (role==='销售/售后'||role==='老板'||isMgr||isFin); c.approve = (isMgr||isFin||role==='老板'); c.price = canPrice; break;
    case 's': // 供应商退货：采购/财务/经理/老板可见；采购可录，审批同 D47
      c.view = (role==='采购'||isMgr||isFin||role==='老板'); c.create = (role==='采购'||allOp||isFin); c.approve = (isMgr||isFin||role==='老板'); c.price = canPrice; break;
    case 'i': // 盘点：仓管/质检可盘，经理/老板可见并审
      c.view = (isWh||isMgr||role==='老板'); c.create = (role==='质检'||role==='理货'||role==='拣货'||allOp); c.approve = (isMgr||role==='老板'); break;
    case 'qty': // 库存数量：仓库岗/采购/经理/老板可见；理货「仅删减」→ 库存减少调整申请（老板/经理审 D47）
      c.view = (isWh||role==='采购'||isMgr||role==='老板'); c.create = (role==='理货'||role==='采购'||allOp); c.approve = (isMgr||role==='老板'); break;
    case 'flow': // 库存流水：仓库岗/采购/财务/经理/老板可见
      c.view = (isWh||role==='采购'||isMgr||isFin||role==='老板'); break;
    case 'stock': // 盘点（菜单项）：仓库岗/经理/老板可见
      c.view = (isWh||isMgr||role==='老板'); break;
    case 'prod': // 商品资料：全岗位可见；采购可编；成本受看价
      c.view = true; c.price = canPrice; c.edit = (role==='采购'||allOp); break;
    case 'plant': // 加工厂档案：采购/经理/老板可见
      c.view = (role==='采购'||isMgr||role==='老板'); c.edit = (role==='采购'||allOp); break;
    case 'emp': // 员工：老板/经理
      c.view = (role==='老板'||isMgr); c.edit = (role==='老板'||isMgr); break;
    case 'co': // 公司管理：老板/经理
      c.view = (role==='老板'||isMgr); c.edit = role==='老板'; break;
    case 'cust': // 客户：销售/财务/经理/老板可见；销售可编
      c.view = (role==='销售/售后'||isMgr||isFin||role==='老板'); c.edit = (role==='销售/售后'||role==='采购'||allOp); break;
    case 'supp': // 供应商：采购/经理/老板可见（销售岗不可见 D4.1）
      c.view = (role==='采购'||isMgr||role==='老板'); c.edit = (role==='采购'||allOp); break;
    default: break;
  }
  return c;
}

// ============ 假数据 ============
const tagClass = s => ({'草稿':'draft','待审':'pending','进行中':'doing','待出库':'doing','已出库':'doing','运输中':'doing','已完成':'done','已取消':'dead','待收货':'pending','已结算':'done','在途':'doing','待审批':'pending'}[s]||'draft');

const DB = {

  ],

  c: [

// 读取某岗位某功能域的实际权限（优先取手动勾改覆盖值，否则用 capsOf 出厂默认）
function permOf(role, dom){
  const base = capsOf(role, dom);
  const ov = (state.permOverride[role] && state.permOverride[role][dom]) || {};
  return Object.assign({}, base, ov);
}

// ===== 员工个人级权限覆盖（D50：经理/老板给单个员工单独开关权限） =====
// 员工编号 → 岗位（原型每人单岗；D4 一人多岗取并集，此处单岗即基线）
function empOf(code){ return DB.employees.find(x=>x.code===code); }
// 某员工的岗位并集基线（D4：一人多岗权限取并集；原型当前每人单岗）
function empBasePerm(emp, dom){
  // 单岗位基线
  return capsOf(emp.role, dom);
}
// 某员工某功能域的最终生效权限 = 岗位并集基线 ⊕ 个人覆盖（可增可减，个人覆盖优先）
function personPermOf(code, dom){
  const emp = empOf(code);
  const base = emp ? empBasePerm(emp, dom) : {view:false,create:false,edit:false,approve:false,ship:false,del:false,price:false,export:false};
  const ov = (state.personOverride[code] && state.personOverride[code][dom]) || {};
  return Object.assign({}, base, ov);
}
// 经理能否编辑该员工：经理不可改老板、财务、其他经理（D50）；老板全权
function canEditPerson(code){
  if(state.role === '老板') return true;
  if(state.role !== '经理') return false;
  const emp = empOf(code);
  if(!emp) return false;
  return !['老板','财务','经理'].includes(emp.role);
}

// 判断某行是否「本人创建」：owner 命中当前登录人 → 可见完整金额（覆盖 D27 看价限制）
const isOwner = owner => owner && owner === ROLE_OPERATOR[state.role];

const MY_DOCS = [
  {key:'a', label:'采购单', dom:'a', statusOf:x=>x.status, ownerOf:x=>x.owner, cells:x=>[x.no,'采购',x.supplier, x.mat, x.status]},

  {key:'c', label:'结算单', dom:'c', statusOf:x=>x.status, ownerOf:x=>x.owner, cells:x=>[x.no,'结算',x.ref, '—', x.status]},
  {key:'r', label:'客户退货', dom:'r', statusOf:x=>x.status, ownerOf:x=>x.owner, cells:x=>[x.no,'退货',x.ref, x.type, x.status]},
  {key:'s', label:'供应商退货', dom:'s', statusOf:x=>x.status, ownerOf:x=>x.owner, cells:x=>[x.no,'退货',x.ref, '—', x.status]},
  {key:'i', label:'盘点', dom:'i', statusOf:x=>x.status, ownerOf:x=>x.owner, cells:x=>[x.no,'盘点',x.wh, x.mat, x.status]},
];
// 收集「我负责的进行中订单」：owner 命中当前登录人 + 状态未完结
function myActiveDocs(){
  const me = ROLE_OPERATOR[state.role];
  const out = [];
  for(const d of MY_DOCS){
    const list = DB[d.key];
    if(!list) continue;
    for(const x of list){
      if(x.owner === me && ACTIVE_STATUS.includes(d.statusOf(x))){
        out.push({...d, x});
      }
    }
  }
  return out;
}

function renderNav(){
  let html = '';
  for(const g of NAV){
    if(!g.items.length) continue;
    // 顶部「工作台/业务全流程图」（无分组标题）常显，不折叠；无权则直接不显示
    if(!g.group){
      for(const [key,label,dom] of g.items){
        const c = dom ? capsOf(state.role, dom) : {view:true};
        if(!c.view) continue; // 无权 → 直接隐藏
        html += `<a data-nav="${key}" class="${state.page===key?'on':''}" title="进入">${label}</a>`;
      }
      continue;
    }
    // 有分组标题的：先筛出有权访问的子项，全无权则整组隐藏
    const visibleItems = g.items.filter(([key,label,dom]) => dom ? capsOf(state.role, dom).view : true);
    if(!visibleItems.length) continue; // 该分组下无任何可访问项 → 隐藏整个分组
    const isOpen = !state.collapsed.has(g.group);
    const cls = isOpen ? '' : 'collapsed';
    html += `<div class="group ${cls}" data-group="${g.group}"><h4><span class="arr">▼</span>${g.group}</h4><div class="items">`;
    for(const [key,label,dom] of visibleItems){
      html += `<a data-nav="${key}" class="${state.page===key?'on':''}" title="进入">${label}</a>`;
    }
    html += '</div></div>';
  }
  $('#nav').innerHTML = html;
}

}

    rows.map(r => `<tr ${rowAttrs?rowAttrs(r):''}>` + r.cells.map((v,i)=>`<td>${v}</td>`).join('') + '</tr>').join('') +

function render(){
  renderNav();
  $('#view').innerHTML = (pages[state.page] || pages.home)();
}

document.addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]');
  if(nav){
    const key = nav.dataset.nav;
    const item = NAV.flatMap(g=>g.items).find(i=>i[0]===key);
    if(item && item[2] && !capsOf(state.role, item[2]).view){
      alert(`${state.role} 无权访问「${item[1]}」`);
      return;
    }
    state.page = key; state.modal = null;
    // 进入某页时，自动展开它所在的分组
    const grp = NAV.find(g=>g.items.some(it=>it[0]===key));
    if(grp && grp.group){ state.collapsed.delete(grp.group); }
    history.replaceState(null,'','#'+key);
    render(); return;
  }
  // 点击分组标题：折叠/展开
  const h4 = e.target.closest('.group h4');
  if(h4){
    const grp = h4.closest('.group').dataset.group;
    if(state.collapsed.has(grp)) state.collapsed.delete(grp);
    else state.collapsed.add(grp);
    render(); return;
  }
  const el = e.target.closest('[data-act]');
  if(!el || el.disabled) return;
  const act = el.dataset.act;
  if(act === 'qtyDetail'){ openQtyDetail(el.dataset.code); return; }
  if(act === 'lossDetail'){ openLossDetail(); return; }
  if(act === 'closeModal'){ state.modal=null; $('#modalRoot').innerHTML=''; return; }
  if(act === 'nop'){ toast('这一页是静态原型，按钮只演示显隐，不接后端。'); return; }
});

// 权限勾选表格：点勾/取消 → 记入 permOverride / personOverride
document.addEventListener('change', e => {
  if(e.target.matches('#permRoleSel')){
    state.permRole = e.target.value; render(); return;
  }
  if(e.target.matches('#permEmpSel')){
    state.permEmp = e.target.value; render(); return;
  }
  if(e.target.matches('input[data-perm]')){
    const {role, dom, act} = e.target.dataset;
    if(!state.permOverride[role]) state.permOverride[role] = {};
    if(!state.permOverride[role][dom]) state.permOverride[role][dom] = {};
    state.permOverride[role][dom][act] = e.target.checked;
  }
  if(e.target.matches('input[data-pemp]')){
    const {emp, dom, act} = e.target.dataset;
    if(!canEditPerson(emp)){ render(); return; } // 越权点击不生效
    if(!state.personOverride[emp]) state.personOverride[emp] = {};
    if(!state.personOverride[emp][dom]) state.personOverride[emp][dom] = {};
    // 与岗位基线一致 → 删除覆盖（回到基线）；不一致 → 记个人覆盖（可增可减）
    const base = empBasePerm(empOf(emp), dom);
    if(e.target.checked === base[act]) delete state.personOverride[emp][dom][act];
    else state.personOverride[emp][dom][act] = e.target.checked;
    render(); return;
  }
});

document.addEventListener('click', e => {
  const pd = e.target.closest('[data-pdim]');
  if(pd){ state.permDim = pd.dataset.pdim; render(); }
});

let toastTimer = null;
function toast(msg){
  let t = $('#toast');
  if(!t){ t = document.createElement('div'); t.id='toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.style.cssText = 'position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1f2328;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;z-index:99;opacity:.96';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.remove(); }, 2200);
}

// 初始化
$('#roleSel').innerHTML = ROLES.map(r=>`<option>${r}</option>`).join('');
const qs = new URLSearchParams(location.search);
if(qs.get('role') && ROLES.includes(qs.get('role'))) state.role = qs.get('role');
if(qs.get('dim') === 'emp') state.permDim = 'emp';
if(qs.get('emp') && DB.employees.some(x=>x.code===qs.get('emp'))) state.permEmp = qs.get('emp');
const hashPage = location.hash.replace('#','');
if(hashPage && pages[hashPage]) state.page = hashPage;
$('#roleSel').value = state.role;
$('#roleSel').addEventListener('change', e=>{
  state.role = e.target.value; state.reqView = false;
  const item = NAV.flatMap(g=>g.items).find(i=>i[0]===state.page);
  if(item && item[2] && !capsOf(state.role, item[2]).view) state.page = 'home';
  render();
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ state.modal=null; $('#modalRoot').innerHTML=''; } });
const modalRoot = document.createElement('div'); modalRoot.id='modalRoot'; document.body.appendChild(modalRoot);
render();
</script>
